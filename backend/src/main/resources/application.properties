spring.application.name=backend

# DataSource Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/3d_cost_manager}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ESIOS Configuration Properties
esios.url=${ESIOS_API_URL:https://api.esios.ree.es}
esios.token=${ESIOS_API_TOKEN:}
esios.indicator-id=${ESIOS_INDICATOR_ID:1001}
esios.connect-timeout-ms=${ESIOS_CONNECT_TIMEOUT:5000}
esios.read-timeout-ms=${ESIOS_READ_TIMEOUT:5000}

