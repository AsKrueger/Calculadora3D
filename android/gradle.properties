# Project-wide Gradle settings.
# Las rutas propias de cada equipo no van aquí:
# - El SDK de Android se indica en local.properties (sdk.dir), que no se versiona.
# - El JDK se toma de JAVA_HOME o del "Gradle JDK" de Android Studio. Si necesitas
#   fijarlo, usa org.gradle.java.home en ~/.gradle/gradle.properties.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m
